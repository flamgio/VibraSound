kind = "web"
previewPath = "/"
title = "Music Rhythm Analyzer"
version = "1.0.0"
id = "artifacts/music-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22782

[services.development]
run = "pnpm --filter @workspace/music-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/music-analyzer", "run", "build" ]
publicDir = "artifacts/music-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22782"
BASE_PATH = "/"
